<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Page</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="feedback.css">
</head>
<body>

<header class="header">
  <h1 class="logo">Student Dashboard</h1>
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="profile.html">Profile</a>
    <a href="courses.html">Courses</a>
    <a href="feedback.html">Feedback</a>
    <a href="grades.html">Grades</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<section class="feedback-container">
  <h2>We Value Your Feedback 💬</h2>
  <p>Your feedback helps us improve and create a better learning experience.</p>

  <form class="feedback-form">
    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Enter your name" required>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Enter your email" required>

    <label for="phone">Phone Number</label>
    <input id="phone" type="text" placeholder="Enter your phone number">

    <label for="message">Message</label>
    <textarea id="message" rows="5" placeholder="Write your feedback..." required></textarea>

    <button type="submit">Submit Feedback</button>
  </form>
</section>

<footer class="footer">
  <p>Designed by Sakshi Sah | Student Dashboard Project</p>
</footer>
</body>
</html>
